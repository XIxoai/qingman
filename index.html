<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>清漫 · QINGMAN ANIME</title>
<meta name="description" content="清漫番剧导航站 —— 超现实主义拼贴 x 科技蓝图风格，收录 743 部番剧。">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Crect%20width='64'%20height='64'%20fill='%230033CC'/%3E%3Ccircle%20cx='32'%20cy='32'%20r='25'%20fill='none'%20stroke='white'%20stroke-width='4'/%3E%3Cpath%20d='M32%2018c7%207%207%2016%200%2023-7-7-7-16%200-23z'%20fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.16/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.16/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/noto-sans-sc@5.0.16/900.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/archivo-black@5.0.16/index.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/space-grotesk@5.0.16/500.css">
<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.1.0/dist/index.global.js"></script>
<style>
/* ============================================================
   清漫 QINGMAN ANIME — 设计系统
   超现实主义拼贴 × 科技蓝图 | 纯白底 · 深蓝 #0033CC · 黑/灰度
   ============================================================ */
:root{
  --blue:#0033CC;
  --blue-2:#00209A;
  --blue-3:#1A47E0;
  --blue-4:#6E8FFF;
  --blue-ghost:rgba(0,51,204,.07);
  --blue-ghost2:rgba(0,51,204,.13);
  --blue-line:rgba(0,51,204,.22);
  --ink:#05070D;
  --gray-9:#141821;
  --gray-6:#5A6272;
  --gray-4:#9AA1B0;
  --gray-3:#B9C0CE;
  --gray-2:#DDE1E9;
  --gray-1:#EFF1F6;
  --paper:#FFFFFF;
  --sakura:#FF8FB1;
  --sakura-soft:rgba(255,143,177,.16);
  --font-d:'Archivo Black','Arial Black','Segoe UI Black','Microsoft YaHei',sans-serif;
  --font-b:'Noto Sans SC','Microsoft YaHei','PingFang SC',system-ui,sans-serif;
  --font-m:'Space Grotesk','Consolas',ui-monospace,monospace;
  --shadow-hard:5px 5px 0 0 rgba(0,51,204,.16);
  --shadow-hard2:9px 9px 0 0 rgba(0,51,204,.12);
  --shadow-blue:0 14px 34px rgba(0,51,204,.16);
  --glow:0 0 0 1px rgba(0,51,204,.85),0 0 16px rgba(0,51,204,.5),0 0 42px rgba(0,51,204,.26);
  --frame:2px solid var(--blue);
  --ease-out:cubic-bezier(.22,1,.36,1);
}
doubao-watermark,[data-custom-element="doubao-watermark"]{display:none!important}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--font-b);font-size:15px;line-height:1.7;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;
}
::selection{background:var(--blue);color:#fff}
a{color:inherit;text-decoration:none}
img{display:block;max-width:100%}
button{font-family:inherit}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
::-webkit-scrollbar{width:11px;height:11px}
::-webkit-scrollbar-track{background:var(--gray-1)}
::-webkit-scrollbar-thumb{background:var(--blue);border:3px solid var(--gray-1)}
#root{min-height:100vh}
.wrap{max-width:1340px;margin:0 auto;padding:0 28px}
.mono{font-family:var(--font-m);letter-spacing:.08em}

/* ---------- 蓝图底纹工具 ---------- */
.grid-bg{
  background-image:linear-gradient(rgba(0,51,204,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(0,51,204,.055) 1px,transparent 1px);
  background-size:64px 64px;
}
.dot-bg{
  background-image:radial-gradient(rgba(0,51,204,.32) 1.1px,transparent 1.1px);
  background-size:18px 18px;
}
.stroke-text{color:transparent;-webkit-text-stroke:2px var(--blue);}

/* ---------- 顶栏 ---------- */
.topbar{
  position:fixed;top:0;left:0;right:0;z-index:80;height:76px;
  background:rgba(255,255,255,.94);backdrop-filter:blur(10px);
  border-bottom:2px solid var(--blue);
}
.topbar::after{
  content:"";position:absolute;left:14px;right:0;bottom:-5px;height:1px;
  background:var(--gray-2);
}
.topbar-inner{max-width:1340px;margin:0 auto;padding:0 28px;height:100%;
  display:flex;align-items:center;gap:26px;}
.brand{display:flex;align-items:center;gap:12px;flex-shrink:0;position:relative}
.brand-mark{width:44px;height:44px;flex-shrink:0;position:relative}
.brand-mark svg{width:100%;height:100%}
.brand-mark::after{content:"";position:absolute;inset:-5px;border:2px solid var(--blue);opacity:.35;transform:rotate(-3deg);pointer-events:none}
.brand-name{display:flex;flex-direction:column;line-height:1.12}
.brand-name b{font-size:21px;font-weight:900;letter-spacing:.02em}
.brand-name em{font-family:var(--font-m);font-style:normal;font-size:9px;letter-spacing:.28em;color:var(--gray-6)}
.brand-sticker{
  position:absolute;right:-8px;top:-14px;background:var(--blue);color:#fff;
  font-family:var(--font-m);font-size:9px;letter-spacing:.12em;padding:3px 7px;
  transform:rotate(5deg);border:1.5px solid #fff;box-shadow:2px 2px 0 rgba(0,51,204,.35);
}
.search-box{
  flex:1;max-width:430px;min-width:0;display:flex;align-items:center;gap:9px;
  height:42px;padding:0 14px;background:#fff;border:2px solid var(--blue);
  box-shadow:3px 3px 0 rgba(0,51,204,.18);transition:box-shadow .25s;
}
.search-box:focus-within{box-shadow:3px 3px 0 rgba(0,51,204,.18),0 0 0 3px rgba(0,51,204,.12)}
.search-box svg{flex-shrink:0;color:var(--blue);width:18px;height:18px}
.search-box input{flex:1;border:none;outline:none;background:transparent;font-size:13.5px;font-family:inherit;color:var(--ink);min-width:0}
.search-box input::placeholder{color:var(--gray-4)}
.search-clear{flex-shrink:0;width:20px;height:20px;border:1.5px solid var(--blue);background:#fff;color:var(--blue);font-size:11px;line-height:1;cursor:pointer;display:grid;place-items:center}
.search-clear:hover{background:var(--blue);color:#fff}
.nav-links{display:flex;align-items:center;gap:6px;margin-left:auto}
.nav-links a{
  position:relative;font-weight:700;font-size:14px;padding:9px 14px;color:var(--gray-6);
  border:2px solid transparent;transition:color .2s,border-color .2s;
}
.nav-links a:hover{color:var(--blue)}
.nav-links a.on{color:var(--blue);border-color:var(--blue);background:var(--blue-ghost);box-shadow:3px 3px 0 rgba(0,51,204,.22)}
.nav-links a.on::before{content:"";position:absolute;left:-7px;top:50%;width:8px;height:8px;background:var(--blue);transform:translateY(-50%) rotate(45deg)}
.menu-btn{display:none;width:42px;height:42px;border:2px solid var(--blue);background:#fff;cursor:pointer;place-items:center;gap:0;box-shadow:3px 3px 0 rgba(0,51,204,.2)}
.menu-btn span{display:block;width:20px;height:2px;background:var(--blue);margin:2.5px 0}
.mobile-menu{display:none;position:fixed;top:76px;left:0;right:0;z-index:79;background:#fff;border-bottom:2px solid var(--blue);padding:10px 28px 18px;box-shadow:0 24px 40px rgba(0,51,204,.14)}
.mobile-menu.open{display:block}
.mobile-menu a{display:block;font-weight:700;padding:11px 4px;border-bottom:1px dashed var(--blue-line);color:var(--gray-6)}
.mobile-menu a.on{color:var(--blue)}

/* ---------- 返回首页悬浮钮 ---------- */
.back-home{position:fixed;left:18px;top:92px;z-index:90;display:flex;flex-direction:column;align-items:center;gap:5px;background:transparent;border:none;cursor:pointer;padding:0}
.bh-circle{
  width:50px;height:50px;border-radius:50%;background:#fff;border:2.5px solid var(--blue);
  display:grid;place-items:center;box-shadow:4px 4px 0 rgba(0,51,204,.22);transition:transform .25s var(--ease-out),background .2s,box-shadow .25s;
}
.bh-circle svg{width:22px;height:22px}
.bh-circle:hover{background:var(--blue);box-shadow:6px 6px 0 rgba(0,51,204,.28)}
.bh-circle:hover svg{stroke:#fff}
.bh-label{font-size:10px;font-weight:900;color:var(--blue);letter-spacing:.14em;transform:rotate(-2deg);background:#fff;padding:1px 5px;border:1.5px solid var(--blue)}

/* ---------- 按钮体系 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:12px 24px;
  font-size:14px;font-weight:900;letter-spacing:.04em;border:2px solid var(--blue);cursor:pointer;
  transition:transform .2s var(--ease-out),box-shadow .2s,background .2s,color .2s;user-select:none;white-space:nowrap}
.btn svg{width:16px;height:16px}
.btn-primary{background:var(--blue);color:#fff;box-shadow:5px 5px 0 rgba(0,51,204,.3)}
.btn-primary:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(0,51,204,.34)}
.btn-primary:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(0,51,204,.3)}
.btn-outline{background:#fff;color:var(--blue);box-shadow:5px 5px 0 rgba(0,51,204,.16)}
.btn-outline:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 rgba(0,51,204,.2);background:var(--blue-ghost)}
.btn-outline:active{transform:translate(1px,1px);box-shadow:2px 2px 0 rgba(0,51,204,.16)}
.btn-sm{padding:8px 15px;font-size:12.5px}

/* ---------- 区块标题 ---------- */
.sec{padding:86px 0 0}
.sec-head{display:flex;align-items:flex-end;gap:18px;margin-bottom:34px;flex-wrap:wrap}
.sec-no{font-family:var(--font-m);font-size:12px;letter-spacing:.2em;color:var(--blue);border:2px solid var(--blue);padding:4px 10px;background:#fff;box-shadow:3px 3px 0 rgba(0,51,204,.2);transform:rotate(-1.5deg);flex-shrink:0}
.sec-title{font-family:var(--font-d);font-size:clamp(28px,4vw,44px);line-height:1.04;margin:0;letter-spacing:.01em}
.sec-title .ac{color:var(--blue)}
.sec-title .sc{display:inline-block;margin-left:10px;-webkit-text-stroke:1.5px var(--blue);color:transparent;transform:translateY(3px)}
.sec-more{margin-left:auto;font-size:13px;font-weight:900;color:var(--blue);border-bottom:2px solid var(--blue);padding-bottom:2px;display:inline-flex;gap:6px;align-items:center}
.sec-more:hover{color:var(--blue-2);border-color:var(--blue-2)}

/* ---------- 筛选 chip ---------- */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.chip{
  padding:9px 8px;background:#fff;border:2px solid var(--gray-3);color:var(--gray-6);
  font-size:13px;font-weight:700;cursor:pointer;transition:all .18s;user-select:none;line-height:1.2;
  text-align:center;display:flex;align-items:center;justify-content:center;
}
.chip:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px)}
.chip.on{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:3px 3px 0 rgba(0,51,204,.32)}
.chip.on:hover{transform:translateY(-2px) rotate(-1deg)}

/* ---------- Hero 轮播 ---------- */
.hero{position:relative;min-height:calc(100vh - 76px);display:flex;flex-direction:column;overflow:hidden;
  background:var(--paper);border-bottom:2px solid var(--blue);}
.hero-bg{position:absolute;inset:0;pointer-events:none}
.hero-bg .bg-grid{position:absolute;inset:0;opacity:.9}
.hero-bg .bg-circle{position:absolute;border:2px solid var(--blue);border-radius:50%}
.hero-bg .bg-circle.fill{background:var(--blue-ghost);border-color:transparent}
.hero-bg .bg-ring{position:absolute;border:2px dashed var(--blue);border-radius:50%}
.hero-bg .bg-square{position:absolute;border:2px solid var(--blue);background:#fff;box-shadow:4px 4px 0 rgba(0,51,204,.14)}
.hero-bg .bg-square.fill{background:var(--blue);border-color:var(--blue);box-shadow:4px 4px 0 rgba(0,51,204,.25)}
.hero-bg .bg-moon{position:absolute;border-radius:50%}
.hero-bg .bg-moon::before{content:"";position:absolute;border-radius:50%;background:var(--paper)}
.hero-bg .bg-mtn{position:absolute;left:0;right:0;bottom:0}
.hero-bg .bg-dot{position:absolute;width:8px;height:8px;background:var(--blue);opacity:.5}
.hero-inner{position:relative;flex:1;display:flex;align-items:center;max-width:1340px;margin:0 auto;width:100%;padding:110px 28px 60px}
.hero-grid{display:grid;grid-template-columns:1.06fr .94fr;gap:46px;align-items:center;width:100%}
.hero-kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-m);font-size:12px;letter-spacing:.22em;color:var(--blue);font-weight:700;margin-bottom:20px}
.hero-kicker::before{content:"";width:44px;height:2px;background:var(--blue);display:inline-block}
.hero-title{font-family:var(--font-d);font-size:clamp(46px,6.4vw,86px);line-height:.98;margin:0 0 8px;letter-spacing:.005em}
.hero-title .row{display:block;position:relative}
.hero-title .row .ghost{position:absolute;left:6px;top:4px;color:transparent;-webkit-text-stroke:2px var(--blue);opacity:.5;pointer-events:none;user-select:none}
.hero-title .row.b2{transform:translateX(28px)}
.hero-title .row .fill-blue{color:var(--blue)}
.hero-desc{max-width:480px;font-size:15.5px;color:var(--gray-6);margin:22px 0 26px}
.hero-meta{display:flex;align-items:center;gap:16px;margin-bottom:30px;flex-wrap:wrap}
.hero-score{width:62px;height:62px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-size:22px;border:3px solid #fff;box-shadow:0 0 0 2px var(--blue),4px 4px 0 rgba(0,51,204,.25)}
.hero-meta .kv{display:flex;flex-direction:column;gap:2px}
.hero-meta .kv i{font-style:normal;font-family:var(--font-m);font-size:10px;letter-spacing:.2em;color:var(--gray-4)}
.hero-meta .kv b{font-size:14px;font-weight:900}
.hero-tags{display:flex;gap:8px;flex-wrap:wrap}
.hero-tags span{font-size:11px;font-weight:700;border:1.5px solid var(--blue-line);color:var(--blue-2);padding:3px 9px;background:#fff}
.hero-actions{display:flex;gap:14px;flex-wrap:wrap}
.hero-poster{position:relative;width:min(400px,100%);margin:0 auto;aspect-ratio:3/4}
.pf-ghost{position:absolute;inset:0;border:2px solid var(--blue);transform:translate(16px,18px);opacity:.4;z-index:0}
.pf-ghost2{position:absolute;inset:0;border:2px dashed var(--blue);transform:translate(-9px,-9px) rotate(2deg);opacity:.45;z-index:0}
.pf-frame{position:absolute;inset:0;background:#fff;border:3px solid var(--blue);padding:12px;box-shadow:var(--shadow-hard2);z-index:1;transform:rotate(-1.2deg);transition:transform .5s var(--ease-out)}
.hero-poster:hover .pf-frame{transform:rotate(0deg)}
.pf-img{position:relative;width:100%;height:100%;border:2px solid var(--blue);overflow:hidden;background:var(--gray-1)}
.pf-img img{width:100%;height:100%;object-fit:cover;object-position:center}
.pf-num{position:absolute;top:-16px;left:-16px;z-index:2;background:var(--blue);color:#fff;font-family:var(--font-m);font-size:11px;letter-spacing:.14em;padding:5px 9px;border:2px solid #fff;box-shadow:3px 3px 0 rgba(0,51,204,.3);transform:rotate(-3deg)}
.pf-ring{position:absolute;right:-30px;top:-26px;width:86px;height:86px;border-radius:50%;border:2px solid var(--blue);z-index:2;background:rgba(255,255,255,.55)}
.pf-ring::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--sakura-soft);border:1.5px solid var(--sakura)}
.pf-sticker{position:absolute;bottom:-14px;right:-6px;z-index:2;background:#fff;border:2px solid var(--blue);padding:7px 13px;font-size:12px;font-weight:900;color:var(--blue);box-shadow:4px 4px 0 rgba(0,51,204,.2);transform:rotate(2.5deg)}
.hero-nav{position:relative;display:flex;align-items:center;justify-content:center;gap:18px;padding:18px 0 26px}
.hnav-btn{width:44px;height:44px;border-radius:50%;border:2px solid var(--blue);background:#fff;color:var(--blue);cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 rgba(0,51,204,.2);transition:transform .2s,background .2s,color .2s}
.hnav-btn svg{width:20px;height:20px}
.hnav-btn:hover{background:var(--blue);color:#fff;transform:translateY(-2px)}
.hero-dots{display:flex;gap:10px;align-items:center}
.hero-dots button{width:12px;height:12px;border:2px solid var(--blue);background:#fff;cursor:pointer;padding:0;transform:rotate(45deg);transition:all .2s}
.hero-dots button.on{background:var(--blue);transform:rotate(45deg) scale(1.15);box-shadow:2px 2px 0 rgba(0,51,204,.3)}
.hero-progress{position:relative;height:3px;background:var(--gray-2);width:180px;overflow:hidden}
.hero-progress i{position:absolute;left:0;top:0;bottom:0;background:var(--blue);width:0}

/* ---------- 跑马灯 ---------- */
.marquee{position:relative;background:var(--blue);color:#fff;overflow:hidden;padding:13px 0;transform:rotate(-1.1deg) scale(1.02);margin:10px 0 -6px;z-index:2}
.marquee-track{display:flex;width:max-content;animation:marq 26s linear infinite}
.marquee:hover .marquee-track{animation-play-state:paused}
.marquee-track span{display:inline-flex;align-items:center;gap:26px;padding-right:26px;font-family:var(--font-d);font-size:15px;letter-spacing:.12em;white-space:nowrap}
.marquee-track span::after{content:"";width:9px;height:9px;background:#fff;transform:rotate(45deg);display:inline-block}
.marquee-2{transform:rotate(1deg) scale(1.02);background:#fff;color:var(--blue);border-top:2px solid var(--blue);border-bottom:2px solid var(--blue);margin-top:2px}
.marquee-2 .marquee-track{animation-duration:32s;animation-direction:reverse}
.marquee-2 span::after{background:var(--blue)}
@keyframes marq{from{transform:translateX(0)}to{transform:translateX(-50%)}}

/* ---------- 番剧卡片（画中画相框） ---------- */
.wall{display:grid;grid-template-columns:repeat(4,1fr);gap:28px}
.anime-card{position:relative;cursor:pointer;padding:0;background:transparent;border:none;text-align:left;font-family:inherit}
.frame-ghost{position:absolute;inset:-9px;border:2px solid var(--blue);opacity:.3;transform:rotate(-1.6deg);z-index:0;pointer-events:none}
.frame-outer{position:relative;z-index:1;background:#fff;border:2px solid var(--blue);padding:10px;box-shadow:var(--shadow-hard2);transition:transform .35s var(--ease-out),box-shadow .35s}
.frame-inner{position:relative;border:2px solid var(--blue);overflow:hidden;aspect-ratio:3/4;background:var(--gray-1)}
.frame-inner::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(0,51,204,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(0,51,204,.05) 1px,transparent 1px);background-size:34px 34px;z-index:1;pointer-events:none}
.frame-inner img{width:100%;height:100%;object-fit:cover;object-position:center;transition:transform .65s var(--ease-out)}
.score-badge{position:absolute;top:-10px;left:-10px;z-index:3;width:48px;height:48px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-size:18px;border:3px solid #fff;box-shadow:0 0 0 2px var(--blue),3px 3px 0 rgba(0,51,204,.28)}
.type-sticker{position:absolute;left:10px;bottom:10px;z-index:3;background:#fff;border:2px solid var(--blue);color:var(--blue);font-size:11px;font-weight:900;padding:3px 9px;transform:rotate(-2deg);box-shadow:2px 2px 0 rgba(0,51,204,.25)}
.heart-flag{position:absolute;right:-8px;top:-8px;z-index:3;width:34px;height:34px;background:#fff;border:2px solid var(--blue);border-radius:50%;display:grid;place-items:center;box-shadow:2px 2px 0 rgba(0,51,204,.25)}
.heart-flag svg{width:15px;height:15px;fill:none;stroke:var(--blue);stroke-width:2}
.heart-flag.liked{background:var(--sakura);border-color:var(--sakura)}
.heart-flag.liked svg{fill:#fff;stroke:#fff}
.card-info{padding:15px 4px 2px;position:relative;z-index:2}
.card-info h3{font-size:16.5px;font-weight:900;margin:0 0 7px;line-height:1.3;transition:color .2s;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.card-meta{display:flex;align-items:center;gap:9px;font-family:var(--font-m);font-size:11.5px;color:var(--gray-6);letter-spacing:.05em;margin-bottom:8px}
.card-meta i{width:3px;height:3px;background:var(--blue);border-radius:50%;display:inline-block}
.card-tags{display:flex;gap:6px;flex-wrap:wrap}
.card-tags span{font-size:10.5px;color:var(--gray-6);border:1px solid var(--gray-2);background:var(--gray-1);padding:2px 7px;font-weight:500}
/* hover：浮起 + 霓虹 + 泡泡 */
.anime-card:hover .frame-outer{transform:translateY(-10px) rotate(-.4deg);box-shadow:var(--glow),var(--shadow-hard2)}
.anime-card:hover .frame-inner img{transform:scale(1.07)}
.anime-card:hover .card-info h3{color:var(--blue)}
.anime-card:hover .frame-ghost{opacity:.55;transform:rotate(-1.6deg) translate(4px,6px)}
.bubbles{position:absolute;inset:0;z-index:6;pointer-events:none;overflow:visible}
.bubbles span{position:absolute;bottom:12%;left:var(--bx);width:var(--bs);height:var(--bs);border-radius:50%;
  background:radial-gradient(circle at 34% 32%,rgba(0,51,204,.55),rgba(0,51,204,.05) 70%);
  opacity:0;transform:translateY(0) scale(.5)}
.anime-card:hover .bubbles span{animation:bubbleUp var(--bd) ease-out var(--bdel) forwards}
@keyframes bubbleUp{
  0%{opacity:0;transform:translateY(0) scale(.5)}
  18%{opacity:1}
  100%{opacity:0;transform:translateY(-88px) translateX(var(--bdx)) scale(1.18)}
}
.bubbles span:nth-child(1){--bx:12%;--bs:16px;--bd:1.7s;--bdel:0s;--bdx:-8px}
.bubbles span:nth-child(2){--bx:26%;--bs:10px;--bd:1.9s;--bdel:.12s;--bdx:10px}

.bubbles span:nth-child(4){--bx:55%;--bs:11px;--bd:2.05s;--bdel:.05s;--bdx:8px}
.bubbles span:nth-child(5){--bx:68%;--bs:15px;--bd:1.75s;--bdel:.3s;--bdx:-6px}
.bubbles span:nth-child(6){--bx:82%;--bs:12px;--bd:1.9s;--bdel:.16s;--bdx:12px}
.bubbles span:nth-child(7){--bx:92%;--bs:9px;--bd:2.15s;--bdel:.1s;--bdx:-9px}
.bubbles span:nth-child(8){--bx:6%;--bs:13px;--bd:1.8s;--bdel:.26s;--bdx:11px}

/* ---------- 详情弹窗 ---------- */
.modal-mask{position:fixed;inset:0;z-index:120;background:rgba(5,7,13,.58);backdrop-filter:blur(7px);display:grid;place-items:center;padding:22px}
.modal-panel{position:relative;background:#fff;border:3px solid var(--blue);width:min(920px,100%);max-height:88vh;overflow:auto;box-shadow:14px 14px 0 rgba(0,51,204,.28);padding:30px}
.modal-panel::before{content:"";position:absolute;right:-16px;top:-16px;width:64px;height:64px;border-radius:50%;border:2px solid var(--blue);opacity:.4;pointer-events:none}
.modal-close{position:absolute;right:16px;top:16px;z-index:5;width:38px;height:38px;border:2px solid var(--blue);background:#fff;color:var(--blue);font-size:15px;cursor:pointer;display:grid;place-items:center;box-shadow:3px 3px 0 rgba(0,51,204,.22)}
.modal-close:hover{background:var(--blue);color:#fff}
.modal-grid{display:grid;grid-template-columns:300px 1fr;gap:30px}
.modal-cover{position:relative;aspect-ratio:3/4;background:#fff;border:2px solid var(--blue);padding:9px;box-shadow:8px 8px 0 rgba(0,51,204,.15)}
.modal-cover .in{border:2px solid var(--blue);overflow:hidden;height:100%}
.modal-cover img{width:100%;height:100%;object-fit:cover}
.modal-body{min-width:0}
.modal-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.modal-tags span{font-size:11px;font-weight:900;border:2px solid var(--blue);color:var(--blue);padding:2px 8px;background:#fff}
.modal-title{font-family:var(--font-d);font-size:clamp(24px,3.4vw,36px);line-height:1.1;margin:0 0 6px}
.modal-sub{font-family:var(--font-m);font-size:12px;letter-spacing:.12em;color:var(--gray-4);margin-bottom:16px}
.modal-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.modal-meta .kv{background:var(--blue-ghost);border:1.5px solid var(--blue-line);padding:6px 12px;font-size:12.5px}
.modal-meta .kv b{font-size:14px;font-weight:900;color:var(--blue-2)}
.modal-desc{font-size:14.5px;color:var(--gray-6);line-height:1.85;margin-bottom:20px}
.modal-eps{display:grid;grid-template-columns:repeat(auto-fill,minmax(58px,1fr));gap:8px;margin-bottom:24px}
.modal-eps span{border:1.5px solid var(--gray-3);font-family:var(--font-m);font-size:12px;text-align:center;padding:6px 2px;color:var(--gray-6);background:#fff}

.modal-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- 页面切换遮罩 ---------- */
.page-wipe{position:fixed;inset:0;z-index:200;background:var(--blue);pointer-events:none;transform-origin:top;
  animation:wipeUp .62s cubic-bezier(.77,0,.18,1) forwards}
.page-wipe::before{content:"";position:absolute;right:-90px;top:-90px;width:280px;height:280px;border-radius:50%;border:3px solid #fff;opacity:.35}
.page-wipe::after{content:"";position:absolute;left:8%;bottom:-60px;width:200px;height:200px;border-radius:50%;border:3px dashed #fff;opacity:.4}
@keyframes wipeUp{0%{transform:scaleY(1)}100%{transform:scaleY(0)}}

/* ---------- 页面骨架 ---------- */
.page{padding-top:76px;min-height:calc(100vh - 76px);position:relative}
.page-main{position:relative;z-index:2}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:34px;z-index:300;transform:translateX(-50%);

.toast::before{content:"";width:9px;height:9px;background:#fff;transform:rotate(45deg);flex-shrink:0}

.note-del{margin-left:10px;padding:3px 12px;font-size:12px;border:2px solid #d33;color:#d33;background:#fff;cursor:pointer;font-weight:700;vertical-align:middle}
.note-del:hover{background:#d33;color:#fff}
.note-tags span{font-size:11px;border:1.5px solid var(--gray-3);padding:2px 9px;color:var(--gray-6);background:var(--gray-1)}
.rev-wrap{padding-top:34px}
.rev-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-bottom:40px}
.rev-stat{border:2px solid var(--blue);background:#fff;padding:22px;box-shadow:var(--shadow-hard);position:relative}
.rev-stat::after{content:"";position:absolute;right:14px;top:14px;width:20px;height:20px;border-radius:50%;border:2px solid var(--blue);opacity:.35}
.rev-stat b{font-family:var(--font-d);font-size:40px;color:var(--blue);display:block;line-height:1}
.rev-stat span{font-size:12px;color:var(--gray-6);letter-spacing:.14em;font-weight:700}
.rev-filters{display:flex;gap:10px;margin-bottom:26px;flex-wrap:wrap}
.rev-wall{columns:3;column-gap:22px}
.rev-card{break-inside:avoid;background:#fff;border:2px solid var(--blue);box-shadow:var(--shadow-hard);padding:20px;margin-bottom:22px;position:relative;transition:transform .25s,box-shadow .25s}
.rev-card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:var(--shadow-blue)}
.rev-card::before{content:"";position:absolute;right:-8px;top:-8px;width:26px;height:26px;background:var(--blue);opacity:.14}
.rev-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.rev-av{width:42px;height:42px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:900;font-size:15px;flex-shrink:0}
.rev-who b{display:block;font-size:14px;line-height:1.2}
.rev-who i{font-style:normal;font-size:11.5px;color:var(--gray-4);font-family:var(--font-m)}
.rev-anime{display:inline-block;font-size:11px;font-weight:900;color:var(--blue-2);border:1.5px solid var(--blue-line);background:var(--blue-ghost);padding:3px 9px;margin-bottom:10px}
.rev-text{font-size:13.5px;color:var(--gray-9);line-height:1.85;margin:0}
.rev-foot{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--gray-2)}
.rev-foot .lk{font-size:12px;color:var(--gray-6);font-weight:700}
.rev-write{margin:34px 0 0}
.rev-write .row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.rev-write .row>input,.rev-write .row>select{flex:1;min-width:130px;height:44px;border:2px solid var(--blue);padding:0 12px;font-size:14px;background:#fff;box-shadow:3px 3px 0 rgba(0,51,204,.12)}
.rev-write textarea{width:100%;border:2px solid var(--blue);padding:12px 14px;font-size:14px;line-height:1.8;margin-bottom:14px;background:#fff;resize:vertical;box-shadow:3px 3px 0 rgba(0,51,204,.12)}
.detail-wrap{padding-top:44px}
.detail-hero{display:grid;grid-template-columns:360px 1fr;gap:54px;align-items:start;margin-bottom:64px}
.detail-cover{position:relative;aspect-ratio:3/4}
.detail-cover .ghost{position:absolute;inset:0;border:2px solid var(--blue);transform:translate(16px,18px);opacity:.35}
.detail-cover .frame{position:relative;border:3px solid var(--blue);background:#fff;padding:12px;box-shadow:var(--shadow-hard2);transform:rotate(-1.2deg)}
.detail-cover .frame .in{border:2px solid var(--blue);overflow:hidden;height:100%}
.detail-cover img{width:100%;height:100%;object-fit:cover}
.detail-kicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--font-m);font-size:12px;letter-spacing:.22em;color:var(--blue);font-weight:700;margin-bottom:16px}
.detail-kicker::before{content:"";width:40px;height:2px;background:var(--blue)}
.detail-title{font-family:var(--font-d);font-size:clamp(34px,5vw,62px);line-height:1.02;margin:0 0 6px}
.detail-sub{font-family:var(--font-m);font-size:13px;letter-spacing:.12em;color:var(--gray-4);margin-bottom:18px}
.detail-meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:22px}
.detail-meta .kv{background:var(--blue-ghost);border:1.5px solid var(--blue-line);padding:7px 14px;font-size:12px;color:var(--gray-6)}
.detail-meta .kv b{display:block;font-size:15px;font-weight:900;color:var(--blue-2)}
.detail-score{display:inline-flex;align-items:center;gap:12px;margin-bottom:20px}
.detail-score .ring{width:64px;height:64px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-size:23px;border:3px solid #fff;box-shadow:0 0 0 2px var(--blue),4px 4px 0 rgba(0,51,204,.25)}
.detail-score .lb{font-size:12px;color:var(--gray-6);font-weight:700;letter-spacing:.08em;line-height:1.6}
.detail-desc{font-size:15px;color:var(--gray-6);line-height:2;max-width:560px;margin-bottom:26px}
.detail-actions{display:flex;gap:14px;flex-wrap:wrap}
.detail-sec{margin-bottom:64px}
.detail-sec h3{font-family:var(--font-d);font-size:26px;margin:0 0 22px;display:flex;align-items:center;gap:14px}
.detail-sec h3::before{content:"";width:12px;height:12px;background:var(--blue);transform:rotate(45deg)}
.eps-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.eps-grid span{border:2px solid var(--gray-3);text-align:center;padding:9px 2px;font-family:var(--font-m);font-size:13px;color:var(--gray-6);background:#fff;transition:all .18s;cursor:default}
.eps-grid span:nth-child(-n+3){border-color:var(--blue);color:var(--blue);font-weight:700;background:var(--blue-ghost)}
.eps-grid span:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-2px);box-shadow:2px 2px 0 rgba(0,51,204,.2)}
.footer-word{margin-top:54px}
@keyframes progress{from{width:0}to{width:100%}}
.hero-progress i{animation:progress 5.2s linear forwards}
.hero-progress i.pause{animation-play-state:paused}
@media (max-width:1180px){.wall{grid-template-columns:repeat(3,1fr)}.lib-wall{grid-template-columns:repeat(2,1fr)}.rev-wall{columns:2}}
@media (max-width:980px){
  .nav-links{display:none}
  .menu-btn{display:grid}
  .hero-grid{grid-template-columns:1fr;gap:34px}
  .hero-poster{width:min(300px,76%);margin:0 auto}
  .hero-title .row.b2{transform:none}
  .hero-desc{max-width:100%}
  .detail-hero{grid-template-columns:1fr;gap:36px}
  .detail-cover{max-width:340px}
  .lib-wrap{grid-template-columns:1fr}
  .lib-side{position:static;display:none;top:auto}
  .lib-side.open{display:block}
  .lib-filter-toggle{display:block}
  .modal-grid{grid-template-columns:1fr;gap:22px}
  .modal-cover{max-width:240px}
  .footer-cols{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:760px){
  .wall{grid-template-columns:repeat(2,1fr);gap:20px 16px}
  .rev-card{padding:16px;margin-bottom:16px}
  .sec{padding-top:60px}
  .note-grid{grid-template-columns:1fr;padding:22px}
  .note-date{border-right:none;border-bottom:2px solid var(--blue-line);padding:0 0 14px;margin-bottom:6px}
  .rev-stats{grid-template-columns:1fr}
  .rev-wall{columns:1}
  .hero-inner{padding-top:80px}
  .hero-nav{gap:12px}
  .hero-progress{width:110px}
  .search-box{max-width:none}
}
@media (max-width:520px){
  .wall{grid-template-columns:repeat(2,1fr);gap:22px 14px;row-gap:26px}
  .lib-wall{grid-template-columns:repeat(2,1fr);gap:22px 14px;row-gap:26px}
  .wrap{padding:0 14px}
  .chips{grid-template-columns:repeat(3,1fr);gap:8px}
  .chip{font-size:12px;padding:8px 4px}
  .hero-actions .btn{flex:1}
  .hero-inner{padding:104px 18px 46px}
  .hero-poster{width:min(250px,78%);margin:0 auto}
  .topbar-inner{gap:10px;padding:0 14px}
  .search-box{min-width:0;height:40px;padding:0 10px}
  .search-box input{font-size:12.5px}
  .brand-name em{display:none}
  .brand-name b{font-size:18px}
  .modal-panel{padding:20px}
  .modal-actions .btn{flex:1}
  .footer-cols{grid-template-columns:1fr}
  .back-home{left:10px;top:88px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
  .page-wipe{display:none}
  .bubbles span{display:none}
}
</style>
<script>
/* 隐藏平台水印（兼容桌面/移动端，含 Shadow DOM） */
(function(){
  function removeEl(el){
    try{ el.style.setProperty('display','none','important'); el.style.setProperty('visibility','hidden','important'); el.style.setProperty('opacity','0','important'); el.style.setProperty('pointer-events','none','important'); if(el.parentNode) el.parentNode.removeChild(el); }catch(e){}
  }
  function kill(root){
    root = root||document;
    root.querySelectorAll('doubao-watermark,[data-custom-element="doubao-watermark"],[class*="watermark" i],[id*="watermark" i]').forEach(removeEl);
    root.querySelectorAll('*').forEach(function(el){
      var t=(el.textContent||'').trim();
      if(t==='豆包工作生成' || t.indexOf('豆包工作生成')===0 && el.children.length<3){
        var r=el.getBoundingClientRect();
        if(r.width<260 && r.height<90 && r.right>window.innerWidth-320 && r.bottom>window.innerHeight-160){ removeEl(el); }
      }
    });
  }
  function sweep(){ kill(document); try{ document.querySelectorAll('*').forEach(function(n){ if(n.shadowRoot) kill(n.shadowRoot); }); }catch(e){} }
  sweep();
  try{ new MutationObserver(function(){ sweep(); }).observe(document.documentElement,{childList:true,subtree:true,attributes:true}); }catch(e){}
  setInterval(sweep, 1200);
})();
</script>
